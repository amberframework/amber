version: 2.1

jobs:
  v2-beta:
    resource_class: medium
    docker:
      # Official Crystal 1.22.1 image, pinned by its multi-arch index digest.
      - image: crystallang/crystal:1.22.1@sha256:1ed8297a705eae76d88bc146ce83d0b00dc014bb201df6d93c024e20c14dbfce
    working_directory: ~/amber
    steps:
      # The legacy CircleCI project SSH key is no longer accepted by GitHub.
      # Clone the public repository that owns the build SHA so fork PR commits
      # remain available instead of always cloning amberframework/amber.
      - run:
          name: Checkout code over HTTPS
          command: |
            git clone "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git" .
            git checkout "$CIRCLE_SHA1"
      - restore_cache:
          keys:
            - v2-shards-{{ checksum "shard.lock" }}
      - run:
          name: Install dependencies
          command: shards install --frozen
      - save_cache:
          key: v2-shards-{{ checksum "shard.lock" }}
          paths:
            - lib
            - bin
      - run:
          name: Check beta contract
          command: scripts/check_beta_contract.sh
      - run:
          name: Run framework specs
          command: crystal spec
      - run:
          name: Check Crystal formatting
          command: crystal tool format --check src spec

workflows:
  v2-beta:
    jobs:
      - v2-beta
