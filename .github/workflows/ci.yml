name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - v2-dev
    tags:
      - "v2.*"
  pull_request:
    branches:
      - master
      - v2-dev

permissions:
  contents: read

# Supply-chain policy for this workflow: every action is pinned to a full
# commit SHA, every compiler is an exact release checked against a sha256
# (tarball) or a content digest (container image) before it runs, and
# dependencies install from the committed shard.lock with --frozen. A hash
# mismatch stops the job. To move to a new Crystal release, update the
# version and both tarball hashes together.

jobs:
  test:
    name: Crystal ${{ matrix.crystal_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            crystal_version: 1.22.1
            crystal_tarball: crystal-1.22.1-1-linux-x86_64-bundled.tar.gz
            crystal_sha256: 8fe554e47ca8c669694956ad8b0fe5847a3304f154e7b52cbd49f5a9deac794d
          - os: macos-15
            crystal_version: 1.22.1
            crystal_tarball: crystal-1.22.1-1-darwin-universal.tar.gz
            crystal_sha256: 8f2dc1ba8219bb2606a2390b11f903f70be346cfeae869557b7c927f37ed9023
          # The lowest Crystal that shard.yml declares (`crystal: ">= 1.20.0"`).
          # Keep this entry equal to that bound, so the declared range is
          # compiled and tested rather than assumed.
          - os: ubuntu-24.04
            crystal_version: 1.20.0
            crystal_tarball: crystal-1.20.0-1-linux-x86_64-bundled.tar.gz
            crystal_sha256: 9f6fb0dd6b38daa22b6fba07342ff72390efe533639d181360793a218ca164c9

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Crystal ${{ matrix.crystal_version }} (sha256-verified)
        env:
          CRYSTAL_TARBALL: ${{ matrix.crystal_tarball }}
          CRYSTAL_SHA256: ${{ matrix.crystal_sha256 }}
          CRYSTAL_VERSION: ${{ matrix.crystal_version }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$CRYSTAL_TARBALL"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/crystal-lang/crystal/releases/download/$CRYSTAL_VERSION/$CRYSTAL_TARBALL"
          echo "$CRYSTAL_SHA256  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          root="$RUNNER_TEMP/crystal-$CRYSTAL_VERSION-1"
          # The darwin tarball keeps shards in embedded/bin. Each GITHUB_PATH
          # line is prepended, so bin/ (written last) wins for `crystal`.
          if [ -d "$root/embedded/bin" ]; then
            echo "$root/embedded/bin" >> "$GITHUB_PATH"
          fi
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Confirm compiler and shards versions
        env:
          CRYSTAL_VERSION: ${{ matrix.crystal_version }}
        run: |
          set -euo pipefail
          test "$(command -v crystal)" = "$RUNNER_TEMP/crystal-$CRYSTAL_VERSION-1/bin/crystal"
          case "$(command -v shards)" in
            "$RUNNER_TEMP/crystal-$CRYSTAL_VERSION-1/"*) ;;
            *) echo "shards does not come from the verified tarball" >&2; exit 1 ;;
          esac
          crystal --version
          shards --version
          crystal --version | grep -qF "Crystal $CRYSTAL_VERSION "
          shards --version | grep -q '^Shards 0\.20\.0 '

      - name: Install dependencies
        run: shards install --frozen

      - name: Check Amber V2 beta contract
        run: scripts/check_beta_contract.sh

      - name: Run specs
        # Defined order for now: the suite has pre-existing order-dependent
        # specs (respond_with + others fail under --order random regardless of
        # recent changes). Tracked as a cleanup task before switching to random.
        run: crystal spec
        env:
          # Spec fixture programs build with the compiler that runs the suite
          # (spec/support/fixture_compiler.cr).
          CRYSTAL: crystal

      - name: Check formatting
        run: crystal tool format --check

  linkage:
    # A minimal JSON API on stock Crystal links no regex engine. The stock
    # tarballs link PCRE2 statically, so the check reads symbols as well as
    # libraries, and a control program that uses Regex must show them.
    name: No PCRE2 on Crystal ${{ matrix.crystal_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            crystal_version: 1.22.2
            crystal_tarball: crystal-1.22.2-1-linux-x86_64-bundled.tar.gz
            crystal_sha256: 0dc5c3ff1b5710c3981e207a6241fc06cc28fadb6622d5fdb21999adf1ca2309
          - os: macos-15
            crystal_version: 1.22.2
            crystal_tarball: crystal-1.22.2-1-darwin-universal.tar.gz
            crystal_sha256: 9c73ddd00aa8c9bf9f8fdc5aebdde99a92a63c2e2539b8ad5f9b8a27813ddc6f

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Crystal ${{ matrix.crystal_version }} (sha256-verified)
        env:
          CRYSTAL_TARBALL: ${{ matrix.crystal_tarball }}
          CRYSTAL_SHA256: ${{ matrix.crystal_sha256 }}
          CRYSTAL_VERSION: ${{ matrix.crystal_version }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$CRYSTAL_TARBALL"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/crystal-lang/crystal/releases/download/$CRYSTAL_VERSION/$CRYSTAL_TARBALL"
          echo "$CRYSTAL_SHA256  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/crystal-$CRYSTAL_VERSION-1/bin" >> "$GITHUB_PATH"

      - name: Check what the minimal JSON app links
        run: scripts/check_linkage.sh "$RUNNER_TEMP/linkage"

  crystal-alpha:
    # The same suite on crystal-alpha, the crimson-knight/crystal fork. The
    # fork publishes no prebuilt compiler, so this job builds it from an exact
    # commit (git verifies every object against that SHA, and the tree hash is
    # checked too) inside the official Crystal 1.22.1 build image, pinned by
    # digest, which supplies the bootstrap compiler, shards and LLVM.
    name: crystal-alpha 1.21.0-incremental-1 on ubuntu-24.04
    runs-on: ubuntu-24.04
    container:
      image: crystallang/crystal:1.22.1-build@sha256:037cc42d8a270f73754aeeca48cb2fcdaa5f883b24a7751ad994bd0fc465cee2
    env:
      CRYSTAL_ALPHA_COMMIT: 9c1e8ec64f6be6343e90d3979bc9536c4b050292 # tag v1.21.0-incremental-1
      CRYSTAL_ALPHA_TREE: 4fdb7a4f547b5b6f6390f34279ac8a1ee60e7327
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: amber
          persist-credentials: false

      - name: Checkout crystal-alpha source at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crimson-knight/crystal
          ref: 9c1e8ec64f6be6343e90d3979bc9536c4b050292 # v1.21.0-incremental-1
          path: crystal-alpha
          persist-credentials: false

      - name: Verify crystal-alpha commit and tree
        working-directory: crystal-alpha
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          test "$(git rev-parse HEAD)" = "$CRYSTAL_ALPHA_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CRYSTAL_ALPHA_TREE"
          test -z "$(git status --porcelain)"

      - name: Build crystal-alpha
        working-directory: crystal-alpha
        run: |
          set -euo pipefail
          make crystal release=1 interpreter=1 FLAGS=--no-debug \
            CRYSTAL_CONFIG_BUILD_COMMIT="${CRYSTAL_ALPHA_COMMIT:0:7}"
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Confirm compiler version
        run: |
          set -euo pipefail
          crystal --version
          crystal --version | grep -q '^Crystal 1\.21\.0 \[9c1e8ec\]'

      - name: Install dependencies
        working-directory: amber
        run: shards install --frozen

      - name: Check Amber V2 beta contract
        working-directory: amber
        run: scripts/check_beta_contract.sh

      - name: Run specs
        working-directory: amber
        run: crystal spec
        env:
          # Spec fixture programs build with the compiler that runs the suite
          # (spec/support/fixture_compiler.cr).
          CRYSTAL: crystal

      - name: Check formatting
        working-directory: amber
        run: crystal tool format --check
